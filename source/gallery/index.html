<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>相册 · 昨日晴空的小窝</title>
<link rel="icon" href="/img/avatar.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #eef2ff;
    background: #05070d;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  #snow {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  /* 背景 */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -2;
    background: url("/img/gallery-bg.jpg") center / cover no-repeat;
    filter: brightness(0.72) saturate(1.0) blur(0.5px);
    transform: scale(1.05);
  }

  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(65% 60% at 50% 45%, rgba(5, 8, 16, 0.05), rgba(3, 5, 10, 0.72) 85%),
      linear-gradient(180deg, rgba(3, 5, 10, 0.55) 0%, rgba(3, 5, 10, 0.12) 45%, rgba(3, 5, 10, 0.8) 100%);
  }

  /* 顶栏 */
  .top {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    z-index: 20;
    background: linear-gradient(180deg, rgba(5, 8, 16, 0.6), transparent);
  }

  .top a, .top button {
    color: #eef2ff;
    text-decoration: none;
    font-size: 13.5px;
    opacity: 0.82;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.2s, transform 0.15s;
  }

  .top a:hover, .top button:hover { opacity: 1; }
  .top a:active, .top button:active { transform: scale(0.95); }

  .top-mid {
    font-size: 13px;
    letter-spacing: 0.35em;
    opacity: 0.5;
    text-transform: uppercase;
  }

  /* 3D 舞台 */
  .stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    perspective: 1400px;
    perspective-origin: 50% 45%;
    cursor: grab;
  }

  .stage.dragging { cursor: grabbing; }

  .ring {
    position: relative;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
    will-change: transform;
  }

  .item {
    position: absolute;
    width: 200px;
    height: 280px;
    margin-left: -100px;
    margin-top: -140px;
    transform-style: preserve-3d;
    backface-visibility: hidden;
    cursor: pointer;
  }

  .item .inner {
    width: 100%;
    height: 100%;
    border-radius: 12px;
    overflow: hidden;
    transform-style: preserve-3d;
    background: #0b0f18;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.07);
    filter: brightness(0.78) saturate(0.95);
    transition: transform 0.38s cubic-bezier(0.34, 1.3, 0.64, 1),
      box-shadow 0.38s ease, filter 0.38s ease;
  }

  .item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }

  .item:hover .inner {
    transform: translateZ(70px) scale(1.07) rotateY(-4deg);
    filter: brightness(1.08) saturate(1.05);
    box-shadow: 0 34px 90px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(160, 200, 255, 0.55),
      0 0 40px rgba(120, 170, 255, 0.25);
  }

  .hint {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 0.12em;
    color: rgba(238, 242, 255, 0.42);
    z-index: 15;
    pointer-events: none;
    white-space: nowrap;
  }

  /* 音乐条 */
  .player {
    position: fixed;
    left: 20px;
    bottom: 22px;
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 9px 15px 9px 9px;
    border-radius: 999px;
    background: rgba(10, 15, 28, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    z-index: 25;
  }

  .p-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    color: #fff;
    font-size: 13px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, rgba(120, 160, 255, 0.95), rgba(90, 110, 220, 0.95));
    transition: transform 0.15s;
  }

  .p-btn:active { transform: scale(0.9); }

  .p-info { display: flex; flex-direction: column; line-height: 1.3; }
  .p-title { font-size: 12px; }
  .p-sub { font-size: 9.5px; letter-spacing: 0.16em; color: rgba(238, 242, 255, 0.45); }

  /* 抖音 */
  /* ===== iOS 开关（Uiverse · zanina-yassine，MIT）===== */
  .sw-panel {
    position: fixed;
    right: 20px;
    bottom: 76px;
    display: grid;
    gap: 10px;
    padding: 14px 16px;
    border-radius: 16px;
    background: rgba(10, 15, 28, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    z-index: 26;
  }

  .sw-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    font-size: 12px;
    color: rgba(238, 242, 255, 0.72);
    cursor: pointer;
    user-select: none;
  }

  .ios-toggle {
    position: relative;
    width: 46px;
    height: 28px;
    flex: 0 0 auto;
  }

  .ios-toggle input {
    opacity: 0;
    width: 0;
    height: 0;
    position: absolute;
  }

  .ios-toggle .track {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 16px;
    background-color: #3a3f4d;
    transition: background-color 0.2s ease-out;
  }

  .ios-toggle .knob {
    position: absolute;
    width: 24px;
    height: 24px;
    left: 2px;
    top: 2px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25), 0 3px 1px rgba(0, 0, 0, 0.06);
    transition: left 0.2s ease-out;
  }

  .ios-toggle input:checked ~ .track { background-color: #34c759; }
  .ios-toggle input:checked ~ .knob { left: 20px; }

  @media (max-width: 768px) {
    .sw-panel { right: 12px; bottom: 68px; padding: 10px 12px; }
  }
  .dy {
    position: fixed;
    right: 20px;
    bottom: 22px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(10, 15, 28, 0.62);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: grid;
    place-items: center;
    cursor: pointer;
    z-index: 25;
  }

  .dy i {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    background: linear-gradient(135deg, #25f4ee, #fe2c55);
    display: block;
  }

  .dy:active { transform: scale(0.92); }

  /* 灯箱 */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 26px 22px 40px;
    overflow-y: auto;
    background: rgba(3, 5, 10, 0.94);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .modal.on { display: flex; }

  .modal img.big {
    max-width: min(900px, 100%);
    max-height: 58vh;
    border-radius: 12px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
    margin-top: 8px;
  }

  .modal-close {
    position: absolute;
    top: 16px;
    right: 18px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
  }

  .comments {
    width: min(760px, 100%);
    margin-top: 20px;
    padding: 18px 20px 22px;
    border-radius: 14px;
    background: #fff;
    color: #333;
  }

  .comments-head {
    font-size: 13px;
    font-weight: 600;
    color: #64748b;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
  }

  .giscus-loading { padding: 24px 0; text-align: center; font-size: 13px; color: #94a3b8; }

  /* 抖音弹窗 */
  .dy-modal {
    position: fixed;
    inset: 0;
    z-index: 70;
    display: none;
    place-items: center;
    background: rgba(3, 5, 10, 0.85);
    backdrop-filter: blur(8px);
  }

  .dy-modal.on { display: grid; }

  .dy-box {
    width: min(340px, 88vw);
    padding: 22px 22px 18px;
    border-radius: 20px;
    text-align: center;
    background: rgba(16, 22, 38, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.12);
    animation: pop 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes pop { from { opacity: 0; transform: scale(0.93); } to { opacity: 1; transform: scale(1); } }

  .dy-box img { width: 210px; border-radius: 12px; background: #000; }
  .dy-box p { margin-top: 12px; font-size: 12.5px; color: rgba(238, 242, 255, 0.6); }

  @media (max-width: 768px) {
    .item { width: 132px; height: 186px; margin-left: -66px; margin-top: -93px; }
    .modal img.big { max-height: 46vh; }
    .hint { font-size: 11px; bottom: 76px; }
  }
</style>
</head>
<body>

<div class="bg"></div>
<canvas id="snow"></canvas>

<header class="top">
  <a href="/">← 返回小窝</a>
  <span class="top-mid">GALLERY</span>
  <a href="/archives/">文章 →</a>
</header>

<div class="stage" id="stage">
  <div class="ring" id="ring"></div>
</div>

<div class="hint">拖动可以转动 · 点击照片看大图并留言</div>

<div class="player">
  <button class="p-btn" id="p-btn">▶</button>
  <div class="p-info">
    <span class="p-title">背景音乐</span>
    <span class="p-sub">NOW PLAYING</span>
  </div>
</div>
<audio id="audio" src="/music/bgm.mp3" loop></audio>

<div class="sw-panel">
  <label class="sw-row">
    <span>下雪</span>
    <span class="ios-toggle">
      <input type="checkbox" id="sw-snow" checked>
      <span class="track"></span>
      <span class="knob"></span>
    </span>
  </label>
  <label class="sw-row">
    <span>音乐</span>
    <span class="ios-toggle">
      <input type="checkbox" id="sw-music">
      <span class="track"></span>
      <span class="knob"></span>
    </span>
  </label>
</div>

<button class="dy" id="dy" aria-label="抖音"><i></i></button>

<!-- 大图 + 评论 -->
<div class="modal" id="modal">
  <button class="modal-close" id="modal-close">×</button>
  <img class="big" id="big" alt="">
  <div class="comments">
    <div class="comments-head">这张照片的评论</div>
    <div id="host"></div>
  </div>
</div>

<!-- 抖音二维码 -->
<div class="dy-modal" id="dy-modal">
  <div class="dy-box">
    <img src="/img/douyin-qr.png" alt="抖音二维码">
    <p>抖音扫码 · @发如雪</p>
  </div>
</div>

<script>
(function () {
  var ring = document.getElementById('ring');
  var stage = document.getElementById('stage');
  var N = 0, angleStep = 0, radius = 700;
  var current = 0, velocity = 0, dragging = false, lastX = 0, paused = false;

  function isMobile() { return window.innerWidth <= 768; }

  function layoutRadius() {
    var cardW = isMobile() ? 132 : 200;
    radius = (cardW / 2) / Math.tan(Math.PI / Math.max(N, 3)) * 1.35;
    if (isMobile()) radius *= 0.92;
  }

  function render() {
    ring.style.transform = 'translateZ(-' + radius + 'px) rotateY(' + current + 'deg)';
  }

  function frame() {
    if (!dragging) {
      if (!paused) current += velocity || 0.08;
      velocity *= 0.94;
      if (Math.abs(velocity) < 0.02) velocity = 0;
    }
    render();
    requestAnimationFrame(frame);
  }

  function build(list) {
    N = list.length;
    if (!N) return;
    angleStep = 360 / N;
    layoutRadius();

    ring.innerHTML = '';
    list.forEach(function (item, i) {
      var d = document.createElement('div');
      d.className = 'item';
      d.style.transform = 'rotateY(' + (i * angleStep) + 'deg) translateZ(' + radius + 'px)';
      var inner = document.createElement('div');
      inner.className = 'inner';
      var img = document.createElement('img');
      img.src = item.src;
      img.alt = item.name;
      img.loading = 'lazy';
      inner.appendChild(img);
      d.appendChild(inner);
      d.addEventListener('click', function (e) {
        e.stopPropagation();
        openPhoto(item.src);
      });
      ring.appendChild(d);
    });

    render();
    requestAnimationFrame(frame);
  }

  /* 拖动 */
  stage.addEventListener('pointerdown', function (e) {
    dragging = true; lastX = e.clientX; stage.classList.add('dragging');
  });
  window.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - lastX;
    lastX = e.clientX;
    current += dx * 0.25;
    velocity = dx * 0.12;
  });
  window.addEventListener('pointerup', function () {
    dragging = false; stage.classList.remove('dragging');
  });
  stage.addEventListener('mouseenter', function () { paused = true; });
  stage.addEventListener('mouseleave', function () { paused = false; });

  window.addEventListener('resize', function () {
    if (!N) return;
    layoutRadius();
    Array.prototype.forEach.call(ring.children, function (el, i) {
      el.style.transform = 'rotateY(' + (i * angleStep) + 'deg) translateZ(' + radius + 'px)';
    });
  });

  /* 大图 + 评论 */
  var modal = document.getElementById('modal');
  var big = document.getElementById('big');
  var host = document.getElementById('host');
  var lastTerm = null;

  function loadComments(term) {
    if (lastTerm === term) return;
    lastTerm = term;
    host.innerHTML = '<div class="giscus-loading">评论加载中…</div>';
    var obs = new MutationObserver(function () {
      if (host.querySelector('iframe')) {
        var t = host.querySelector('.giscus-loading');
        if (t) t.remove();
        obs.disconnect();
      }
    });
    obs.observe(host, { childList: true, subtree: true });

    var s = document.createElement('script');
    s.src = 'https://giscus.app/client.js';
    s.setAttribute('data-repo', 'zal-mrx/blog');
    s.setAttribute('data-repo-id', 'R_kgDOVbv6Hg');
    s.setAttribute('data-category-id', 'DIC_kwDOVbv6Hs4DJ6qB');
    s.setAttribute('data-mapping', 'specific');
    s.setAttribute('data-term', term);
    s.setAttribute('data-strict', '0');
    s.setAttribute('data-reactions-enabled', '1');
    s.setAttribute('data-emit-metadata', '0');
    s.setAttribute('data-input-position', 'top');
    s.setAttribute('data-theme', 'light');
    s.setAttribute('data-lang', 'zh-CN');
    s.setAttribute('crossorigin', 'anonymous');
    s.async = true;
    host.appendChild(s);
  }

  function openPhoto(src) {
    big.src = src;
    modal.classList.add('on');
    loadComments(src);
  }

  document.getElementById('modal-close').addEventListener('click', function () {
    modal.classList.remove('on');
  });
  modal.addEventListener('click', function (e) {
    if (e.target === modal) modal.classList.remove('on');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') modal.classList.remove('on');
  });

    /* 抖音 */
  var dyModal = document.getElementById('dy-modal');
  document.getElementById('dy').addEventListener('click', function () {
    dyModal.classList.add('on');
  });
  dyModal.addEventListener('click', function () { dyModal.classList.remove('on'); });

  /* 音乐 */
  var audio = document.getElementById('audio');
  var btn = document.getElementById('p-btn');

  function syncBtn() { btn.textContent = audio.paused ? '▶' : '❚❚'; }

  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (audio.paused) { audio.play().then(syncBtn).catch(function () {}); }
    else { audio.pause(); syncBtn(); }
  });

  audio.addEventListener('play', syncBtn);
  audio.addEventListener('pause', syncBtn);

  /* 首次点击/触摸时自动播放 */
  function autoPlay() {
    audio.play().then(syncBtn).catch(function () {});
    document.removeEventListener('pointerdown', autoPlay);
  }
  document.addEventListener('pointerdown', autoPlay, { once: true });


  /* 下雪 */
  (function snow() {
    var cv = document.getElementById('snow');
    if (!cv) return;
    var ctx = cv.getContext('2d');
    var flakes = [];
    var W = 0, H = 0;

    function resize() {
      W = cv.width = window.innerWidth;
      H = cv.height = window.innerHeight;
      var count = Math.round(W * H / 14000);
      flakes = [];
      for (var i = 0; i < count; i++) {
        flakes.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() * 1.8 + 0.6,
          s: Math.random() * 0.6 + 0.25,
          d: Math.random() * Math.PI * 2,
          o: Math.random() * 0.5 + 0.35
        });
      }
    }

    function tick() {
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < flakes.length; i++) {
        var f = flakes[i];
        f.y += f.s;
        f.x += Math.sin(f.d) * 0.45;
        f.d += 0.01;
        if (f.y > H + 6) { f.y = -6; f.x = Math.random() * W; }
        if (f.x > W + 6) f.x = -6;
        if (f.x < -6) f.x = W + 6;

        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,' + f.o + ')';
        ctx.fill();
      }
      requestAnimationFrame(tick);
    }

    window.addEventListener('resize', resize);
    resize();
    tick();
  })();

  /* ---------- 开关：下雪 / 音乐 ---------- */
  var snowCanvas = document.getElementById('snow');
  var swSnow = document.getElementById('sw-snow');
  var swMusic = document.getElementById('sw-music');

  swSnow.addEventListener('change', function () {
    snowCanvas.style.display = swSnow.checked ? 'block' : 'none';
  });

  function syncMusicSwitch() {
    swMusic.checked = !audio.paused;
  }

  swMusic.addEventListener('change', function () {
    if (swMusic.checked) { audio.play().then(syncMusicSwitch).catch(function () { swMusic.checked = false; }); }
    else { audio.pause(); }
  });

  audio.addEventListener('play', syncMusicSwitch);
  audio.addEventListener('pause', syncMusicSwitch);

  /* 加载照片列表 */
  fetch('/gallery/list.json')
    .then(function (r) { return r.json(); })
    .then(build)
    .catch(function () {
      ring.innerHTML = '<div style="color:#889;font-size:13px">照片列表加载失败</div>';
    });
})();
</script>
</body>
</html>
